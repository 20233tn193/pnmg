services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "1234567890"
      MYSQL_DATABASE: pmng
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234567890"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pmng?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234567890"
    ports:
      - "8089:8080"

  frontend:
    build: ./Client
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
